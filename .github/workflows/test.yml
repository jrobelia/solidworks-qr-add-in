name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The headless suite builds SolidWorksQrAddIn.Core + Tests only —
      # neither references SolidWorks interop, so no SolidWorks install is
      # needed. LiveProbe is excluded by targeting the test csproj.
      - name: Restore (locked)
        run: dotnet restore tests/SolidWorksQrAddIn.Tests/SolidWorksQrAddIn.Tests.csproj --locked-mode

      - name: Test
        run: dotnet test tests/SolidWorksQrAddIn.Tests/SolidWorksQrAddIn.Tests.csproj -c Release --no-restore
